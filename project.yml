name: CometWall
options:
  bundleIdPrefix: com.timbarsness
  deploymentTarget:
    macOS: "14.0"
targets:
  CometWall:
    type: application
    platform: macOS
    sources:
      - path: CometWall
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timbarsness.cometwall
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CometWall/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: CometWall
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: CometWall/CometWall.entitlements
